# Netlify builds this as a regular Next.js app: its Next.js support
# (detected automatically) serves the pages, runs route handlers such as
# app/api/contact/route.ts as functions, and optimises next/image through
# Netlify Image CDN. It also caches Next's hashed build files itself.
#
# Environment variables (Site configuration → Environment variables):
#   LARAVEL_API_URL    required, scope: Functions
#   LARAVEL_API_TOKEN  optional, scope: Functions

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
